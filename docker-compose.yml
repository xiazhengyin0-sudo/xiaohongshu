services:
  # 小红书 MCP 服务
  xiaohongshu-mcp:
    image: xpzouying/xiaohongshu-mcp:latest
    container_name: xhs-mcp
    restart: unless-stopped
    ports:
      - "18060:18060"
    volumes:
      - ./data/cookies:/app/data
      - ./data/images:/app/images
      - ./config:/app/config
    environment:
      - TZ=Asia/Shanghai
      - XHS_PROXY=${XHS_PROXY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18060/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AI 分析引擎
  ai-engine:
    build:
      context: ./services/ai-engine
      dockerfile: Dockerfile
    container_name: xhs-ai-engine
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./services/ai-engine:/app
      - ./data/cache:/app/cache
    environment:
      - TZ=Asia/Shanghai
      # AI 模型配置 - 支持多种国内模型
      - AI_PROVIDER=${AI_PROVIDER:-zhipu}  # zhipu, qwen, baidu, deepseek, moonshot
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - ZHIPU_MODEL=${ZHIPU_MODEL:-glm-4}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - QWEN_MODEL=${QWEN_MODEL:-qwen-max}
      - BAIDU_API_KEY=${BAIDU_API_KEY:-}
      - BAIDU_SECRET_KEY=${BAIDU_SECRET_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
    depends_on:
      - xiaohongshu-mcp

  # 数据采集服务
  data-collector:
    build:
      context: ./services/data-collector
      dockerfile: Dockerfile
    container_name: xhs-data-collector
    restart: unless-stopped
    volumes:
      - ./services/data-collector:/app
      - ./data/cache:/app/data
    environment:
      - TZ=Asia/Shanghai
      - XHS_MCP_URL=http://xiaohongshu-mcp:18060/mcp
      - COLLECT_INTERVAL=${COLLECT_INTERVAL:-3600}
    depends_on:
      - xiaohongshu-mcp

  # Web 管理界面
  web-ui:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
    container_name: xhs-web-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./web-ui:/app
    environment:
      - TZ=Asia/Shanghai
      - VITE_API_URL=http://localhost:8001
    depends_on:
      - ai-engine

networks:
  default:
    name: xhs-network
