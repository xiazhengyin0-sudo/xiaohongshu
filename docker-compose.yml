services:
  # 小红书 MCP 服务
  xiaohongshu-mcp:
    image: xpzouying/xiaohongshu-mcp:latest
    container_name: xhs-mcp
    restart: unless-stopped
    ports:
      - "18060:18060"
    volumes:
      - ./data/cookies:/app/data
      - ./data/images:/app/images
      - ./config:/app/config
    environment:
      - TZ=Asia/Shanghai
      - XHS_PROXY=${XHS_PROXY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18060/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AI 分析引擎
  ai-engine:
    build:
      context: ./services/ai-engine
      dockerfile: Dockerfile
    container_name: xhs-ai-engine
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./services/ai-engine:/app
      - ./data/cache:/app/cache
    env_file:
      - ./config/.env
    environment:
      - TZ=Asia/Shanghai
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      - xiaohongshu-mcp

  # 数据采集服务
  data-collector:
    build:
      context: ./services/data-collector
      dockerfile: Dockerfile
    container_name: xhs-data-collector
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./services/data-collector:/app
      - ./data/cache:/app/data
    env_file:
      - ./config/.env
    environment:
      - TZ=Asia/Shanghai
      - XHS_MCP_URL=http://xiaohongshu-mcp:18060/mcp
      - COLLECT_INTERVAL=${COLLECT_INTERVAL:-3600}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      - xiaohongshu-mcp

  # Web 管理界面
  web-ui:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
    container_name: xhs-web-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./web-ui:/app
    environment:
      - TZ=Asia/Shanghai
      - AI_API_URL=http://localhost:8001
      - DATA_API_URL=http://localhost:8002
    depends_on:
      - ai-engine

networks:
  default:
    name: xhs-network
